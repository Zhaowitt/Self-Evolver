# Controller SFT warm-up (legal skill selection only) for scripts/tools/train_controller_sft.py.
model_path: Qwen/Qwen3.5-4B
max_sequence_length: 13312
# LoRA on a few hundred rows needs ~1e-4 to move in 1-2 epochs.
epochs: 2
learning_rate: 0.0001
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
# Matches the GRPO LoRA placement.
lora_target_modules: all-linear
per_device_batch_size: 1
gradient_accumulation_steps: 8
warmup_ratio: 0.05
seed: 1
max_new_tokens: 256
# Acceptance gate on the held-out SFT split.
min_json_valid_rate: 0.95
min_legal_selection_rate: 1.0
response_schema:
  max_selected_skills: 2
  allow_short_strategy: true
  forbidden_fields: budget,target_failure_type,memory_query,task_wrapper
