# One-A100 EasyR1 GRPO config for the Controller; scripts/tools/grpo_round.sh supplies absolute paths.
data:
  train_files: data/controller_train.jsonl
  val_files: data/controller_val.jsonl
  prompt_key: prompt
  answer_key: ground_truth
  max_prompt_length: 12288
  max_response_length: 1024
  # 2 prompts x 6 samples = 12 rollouts/step: at ~10% resolve, 6 samples give
  # far more groups with outcome variance than 3.
  rollout_batch_size: 2
  mini_rollout_batch_size: null
  val_batch_size: 2
  format_prompt: null
  shuffle: true
  seed: 1
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 8

algorithm:
  # RLOO: GRPO's std normalization inflates token-cost noise in all-failed groups.
  adv_estimator: rloo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false

worker:
  actor:
    global_batch_size: 2
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      # Overridden by CONTROLLER_MODEL_PATH (HF id or local snapshot).
      model_path: Qwen/Qwen3.5-4B
      enable_gradient_checkpointing: true
      trust_remote_code: false
      lora:
        rank: 16
        alpha: 32
        target_modules: all-linear
    optim:
      # LoRA needs a larger step than full fine-tuning; 1e-6 barely moves in 64 steps.
      lr: 1.0e-5
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.03
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    n: 6
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    # Colocated vLLM shares the 80 GiB A100 with the resident FSDP actor.
    gpu_memory_utilization: 0.2
    enforce_eager: true
    enable_chunked_prefill: true
    tensor_parallel_size: 1
    max_model_len: 13312
    max_num_batched_tokens: 13312
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      # Two samples per task halve validation variance.
      n: 2

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      # EasyR1 LoRA reuses the actor as reference: keep it on GPU.
      offload_params: false

  reward:
    reward_function: src/reward/online_reward.py:compute_score
    num_cpus: 4

trainer:
  total_epochs: 1
  max_steps: 64
  project_name: self_evolver
  experiment_name: controller_online_grpo_qwen3_5_4b_round1_64step
  logger: [console]
  nnodes: 1
  n_gpus_per_node: 1
  max_try_make_batch: 20
  # Validate once per 64-step round.
  val_freq: 64
  # scripts/5_grpo.sh keeps this only for round 1.
  val_before_train: true
  val_generations_to_log: 2
  save_freq: 4
  save_limit: 3
  find_last_checkpoint: true
