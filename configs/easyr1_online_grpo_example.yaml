# One-A100 EasyR1 GRPO configuration for the Self-Evolver Controller.
# scripts/run_rl_controller.sh supplies absolute train/validation/reward paths.
data:
  train_files: data/controller_train.jsonl
  val_files: data/controller_val.jsonl
  prompt_key: prompt
  answer_key: ground_truth
  max_prompt_length: 12288
  max_response_length: 1024
  rollout_batch_size: 4
  mini_rollout_batch_size: null
  val_batch_size: 2
  format_prompt: null
  shuffle: true
  seed: 1
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 8

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false

worker:
  actor:
    global_batch_size: 4
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      # Portable default. CONTROLLER_MODEL_PATH can override this with either
      # another Hugging Face ID or a cluster-local snapshot path.
      model_path: Qwen/Qwen3.5-4B
      enable_gradient_checkpointing: true
      trust_remote_code: false
      lora:
        rank: 16
        alpha: 32
        target_modules: all-linear
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw_bf16
      lr_warmup_ratio: 0.03
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      offload_params: false
      offload_optimizer: false

  rollout:
    n: 3
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    # Reserve a bounded fraction of an 80 GiB A100 for the colocated vLLM
    # rollout engine while the FSDP actor remains resident on the same GPU.
    gpu_memory_utilization: 0.2
    enforce_eager: true
    enable_chunked_prefill: true
    tensor_parallel_size: 1
    max_model_len: 13312
    max_num_batched_tokens: 13312
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      torch_dtype: bf16
    offload:
      # LoRA reuses the actor module as the reference model in EasyR1.
      # Keep the shared module on GPU when using the unmodified EasyR1 worker.
      offload_params: false

  reward:
    reward_function: src/reward/online_reward.py:compute_score
    num_cpus: 4

trainer:
  total_epochs: 1
  max_steps: 64
  project_name: self_evolver
  experiment_name: controller_online_grpo_qwen3_5_4b_round1_64step
  logger: [console]
  nnodes: 1
  n_gpus_per_node: 1
  max_try_make_batch: 20
  # Full official validation once at the 64-step round boundary.
  val_freq: 64
  val_before_train: false
  val_generations_to_log: 2
  save_freq: 4
  save_limit: 3
  find_last_checkpoint: true
