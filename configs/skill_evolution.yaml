# SkillEvolutionConfig fields (unknown keys are rejected).
# Similarity above which a proposed skill is a duplicate.
skill_similarity_threshold: 0.88
# Minimum utility for a Reflector skill write.
skill_write_utility_threshold: 0.55
max_selected_skills: 2
# Past this cap, lowest-contribution skills are evicted.
max_active_skills: 12
# Credited trials required before retirement.
retire_min_trials: 30
# Completed GRPO rounds of harm required (never retired mid-round).
retire_min_rounds: 2
# Retire when (successes - failures) / trials <= this.
retire_net_success_threshold: -0.2
# Also require mean advantage below this in every considered round.
retire_average_advantage_threshold: 0.0
# EMA smoothing for the advantage baseline.
baseline_ema_alpha: 0.3
